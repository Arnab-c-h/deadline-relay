[project]
name = "deadline-relay"
version = "0.1.0"
description = "Approval-based deadline coordination across three apps"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "tzdata>=2025", "google-auth>=2,<3", "google-auth-oauthlib>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
